openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: BaleBeleqNews API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: articles
    description: News article operations
  - name: categories
    description: Category operations
  - name: auth
    description: Admin authentication
  - name: storage
    description: File upload operations
  - name: users
    description: Admin user management (owner only)
  - name: donations
    description: Berugak Donasi - campaign donasi & transaksi donatur
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"

  /articles:
    get:
      operationId: listArticles
      tags: [articles]
      summary: List published articles
      parameters:
        - name: page
          in: query
          schema:
            type: integer
            default: 1
        - name: limit
          in: query
          schema:
            type: integer
            default: 10
        - name: categoryId
          in: query
          schema:
            type: integer
        - name: search
          in: query
          schema:
            type: string
      responses:
        "200":
          description: List of articles
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ArticleListResponse"
    post:
      operationId: createArticle
      tags: [articles]
      summary: Create a new article (admin only)
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ArticleInput"
      responses:
        "201":
          description: Article created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Article"
        "401":
          description: Unauthorized

  /admin/articles/{id}:
    get:
      operationId: getAdminArticle
      tags: [articles]
      summary: Get any article by ID including drafts (admin only)
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Article found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Article"
        "401":
          description: Unauthorized
        "404":
          description: Not found

  /admin/articles:
    get:
      operationId: listAllArticles
      tags: [articles]
      summary: List all articles including drafts (admin only)
      security:
        - bearerAuth: []
      parameters:
        - name: page
          in: query
          schema:
            type: integer
            default: 1
        - name: limit
          in: query
          schema:
            type: integer
            default: 100
      responses:
        "200":
          description: All articles (published + draft)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ArticleListResponse"
        "401":
          description: Unauthorized

  /articles/featured:
    get:
      operationId: getFeaturedArticles
      tags: [articles]
      summary: Get featured/latest articles for homepage
      responses:
        "200":
          description: Featured articles
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Article"

  /articles/stats:
    get:
      operationId: getArticleStats
      tags: [articles]
      summary: Get article statistics (admin)
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Article statistics
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ArticleStats"

  /articles/{id}:
    get:
      operationId: getArticle
      tags: [articles]
      summary: Get single article by ID
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Article found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Article"
        "404":
          description: Not found
    put:
      operationId: updateArticle
      tags: [articles]
      summary: Update article (admin only)
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ArticleInput"
      responses:
        "200":
          description: Article updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Article"
        "401":
          description: Unauthorized
    delete:
      operationId: deleteArticle
      tags: [articles]
      summary: Delete article (admin only)
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Deleted
        "401":
          description: Unauthorized

  /articles/{id}/slug:
    get:
      operationId: getArticleBySlug
      tags: [articles]
      summary: Get single article by slug
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Article found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Article"
        "404":
          description: Not found

  /articles/{id}/views:
    post:
      operationId: incrementArticleViews
      tags: [articles]
      summary: Increment article view count
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: View incremented

  /articles/{id}/comments:
    get:
      operationId: listComments
      tags: [articles]
      summary: List comments for an article
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: List of comments
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Comment"
    post:
      operationId: createComment
      tags: [articles]
      summary: Create a comment on an article
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CommentInput"
      responses:
        "201":
          description: Comment created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Comment"
        "400":
          description: Invalid input
        "404":
          description: Article not found

  /admin/comments:
    get:
      operationId: listAdminComments
      tags: [articles]
      summary: List all comments with sender details (admin only)
      security:
        - bearerAuth: []
      responses:
        "200":
          description: List of admin comments
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/AdminComment"
        "401":
          description: Unauthorized

  /admin/comments/{id}:
    put:
      operationId: updateAdminComment
      tags: [articles]
      summary: Update a comment (admin only)
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                content:
                  type: string
              required:
                - content
      responses:
        "200":
          description: Comment updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminComment"
        "401":
          description: Unauthorized
        "404":
          description: Not found
    delete:
      operationId: deleteAdminComment
      tags: [articles]
      summary: Delete a comment (admin only)
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Deleted
        "401":
          description: Unauthorized
        "404":
          description: Not found

  /complaints:
    post:
      operationId: createComplaint
      tags: [complaints]
      summary: Submit a public complaint/report
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ComplaintInput"
      responses:
        "201":
          description: Complaint submitted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PublicComplaint"
        "400":
          description: Invalid input

  /complaints/track:
    get:
      operationId: trackComplaint
      tags: [complaints]
      summary: Track a complaint using complaint number and email
      parameters:
        - name: complaintNumber
          in: query
          required: true
          schema:
            type: string
        - name: email
          in: query
          required: true
          schema:
            type: string
            format: email
      responses:
        "200":
          description: Complaint tracking result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TrackedComplaint"
        "400":
          description: Missing tracking fields
        "404":
          description: Complaint not found

  /admin/complaints:
    get:
      operationId: listAdminComplaints
      tags: [complaints]
      summary: List all complaints (admin only)
      security:
        - bearerAuth: []
      responses:
        "200":
          description: List of complaints
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminComplaintList"
        "401":
          description: Unauthorized

  /admin/complaints/{id}:
    get:
      operationId: getAdminComplaint
      tags: [complaints]
      summary: Get a complaint (admin only)
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Complaint details
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminComplaint"
        "401":
          description: Unauthorized
        "404":
          description: Not found
    delete:
      operationId: deleteAdminComplaint
      tags: [complaints]
      summary: Delete a complaint (admin only)
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Deleted
        "401":
          description: Unauthorized
        "404":
          description: Not found

  /admin/complaints/{id}/status:
    patch:
      operationId: updateComplaintStatus
      tags: [complaints]
      summary: Update complaint status (admin only)
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ComplaintStatusUpdate"
      responses:
        "200":
          description: Complaint updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminComplaint"
        "401":
          description: Unauthorized
        "404":
          description: Not found

  /categories:
    get:
      operationId: listCategories
      tags: [categories]
      summary: List all categories
      responses:
        "200":
          description: List of categories
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Category"
    post:
      operationId: createCategory
      tags: [categories]
      summary: Create a category (admin only)
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CategoryInput"
      responses:
        "201":
          description: Category created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Category"

  /auth/login:
    post:
      operationId: adminLogin
      tags: [auth]
      summary: Admin login
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginCredentials"
      responses:
        "200":
          description: Login successful
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LoginResponse"
        "401":
          description: Invalid credentials

  /auth/me:
    get:
      operationId: getMe
      tags: [auth]
      summary: Get current admin user
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Current user info
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminUser"
        "401":
          description: Unauthorized

  /storage/uploads/request-url:
    post:
      operationId: requestUploadUrl
      tags: [storage]
      summary: Request presigned upload URL
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RequestUploadUrlBody"
      responses:
        "200":
          description: Presigned upload URL
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RequestUploadUrlResponse"
        "401":
          description: Unauthorized

  /storage/objects/{objectPath}:
    get:
      operationId: getObject
      tags: [storage]
      summary: Get/redirect to object
      parameters:
        - name: objectPath
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Object content or redirect
        "404":
          description: Not found

  /admin/users:
    get:
      operationId: listAdminUsers
      tags: [users]
      summary: List all admin users (owner only)
      security:
        - bearerAuth: []
      responses:
        "200":
          description: List of admin users
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/AdminUser"
        "401":
          description: Unauthorized
        "403":
          description: Forbidden (owner only)
    post:
      operationId: createAdminUser
      tags: [users]
      summary: Create admin user (owner only)
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AdminUserCreate"
      responses:
        "201":
          description: Created user
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminUser"
        "401":
          description: Unauthorized
        "403":
          description: Forbidden (owner only)

  /admin/users/{id}:
    put:
      operationId: updateAdminUser
      tags: [users]
      summary: Update admin user (owner only)
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AdminUserCreate"
      responses:
        "200":
          description: Updated user
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminUser"
        "401":
          description: Unauthorized
        "403":
          description: Forbidden (owner only)
    delete:
      operationId: deleteAdminUser
      tags: [users]
      summary: Delete admin user (owner only)
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Deleted
        "401":
          description: Unauthorized
        "403":
          description: Forbidden (owner only)

  /donations/settings:
    get:
      operationId: getDonationSettings
      tags: [donations]
      summary: Public donation settings (hero text, default QRIS/rekening)
      responses:
        "200":
          description: Donation settings
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DonationSettings"

  /donations/campaigns:
    get:
      operationId: listDonationCampaigns
      tags: [donations]
      summary: List active donation campaigns
      responses:
        "200":
          description: List of active campaigns
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/DonationCampaign"

  /donations/campaigns/{slug}:
    get:
      operationId: getDonationCampaign
      tags: [donations]
      summary: Get a donation campaign by slug
      parameters:
        - name: slug
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Campaign found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DonationCampaign"
        "404":
          description: Not found

  /donations/transactions:
    post:
      operationId: createDonationTransaction
      tags: [donations]
      summary: Submit a donation
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DonationTransactionInput"
      responses:
        "201":
          description: Donation submitted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DonationTransactionCreated"
        "400":
          description: Invalid payload
        "404":
          description: Campaign not found

  /donations/transactions/{reference}:
    get:
      operationId: trackDonationTransaction
      tags: [donations]
      summary: Track donation status by reference number
      parameters:
        - name: reference
          in: path
          required: true
          schema:
            type: string
        - name: email
          in: query
          schema:
            type: string
      responses:
        "200":
          description: Donation status
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DonationTransactionStatus"
        "404":
          description: Not found

  /admin/donations/campaigns:
    get:
      operationId: listAdminDonationCampaigns
      tags: [donations]
      summary: List all donation campaigns (admin only)
      security:
        - bearerAuth: []
      parameters:
        - name: page
          in: query
          schema:
            type: integer
            default: 1
        - name: limit
          in: query
          schema:
            type: integer
            default: 20
        - name: search
          in: query
          schema:
            type: string
        - name: status
          in: query
          schema:
            type: string
      responses:
        "200":
          description: Paginated campaigns
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DonationCampaignListResponse"
        "401":
          description: Unauthorized
    post:
      operationId: createDonationCampaign
      tags: [donations]
      summary: Create a donation campaign (admin only)
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DonationCampaignInput"
      responses:
        "201":
          description: Campaign created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DonationCampaign"
        "401":
          description: Unauthorized

  /admin/donations/campaigns/{id}:
    get:
      operationId: getAdminDonationCampaign
      tags: [donations]
      summary: Get a donation campaign (admin only)
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Campaign found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DonationCampaign"
        "401":
          description: Unauthorized
        "404":
          description: Not found
    put:
      operationId: updateDonationCampaign
      tags: [donations]
      summary: Update a donation campaign (admin only)
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DonationCampaignInput"
      responses:
        "200":
          description: Campaign updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DonationCampaign"
        "401":
          description: Unauthorized
        "404":
          description: Not found
    delete:
      operationId: deleteDonationCampaign
      tags: [donations]
      summary: Delete a donation campaign (admin only)
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Deleted
        "401":
          description: Unauthorized

  /admin/donations/transactions:
    get:
      operationId: listAdminDonationTransactions
      tags: [donations]
      summary: List donation transactions (admin only)
      security:
        - bearerAuth: []
      parameters:
        - name: page
          in: query
          schema:
            type: integer
            default: 1
        - name: limit
          in: query
          schema:
            type: integer
            default: 20
        - name: status
          in: query
          schema:
            type: string
        - name: campaignId
          in: query
          schema:
            type: integer
        - name: search
          in: query
          schema:
            type: string
      responses:
        "200":
          description: Paginated transactions
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DonationTransactionListResponse"
        "401":
          description: Unauthorized

  /admin/donations/transactions/{id}:
    patch:
      operationId: updateDonationTransaction
      tags: [donations]
      summary: Verify or reject a donation transaction (admin only)
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DonationTransactionUpdate"
      responses:
        "200":
          description: Transaction updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DonationTransaction"
        "401":
          description: Unauthorized
        "404":
          description: Not found

  /admin/donations/stats:
    get:
      operationId: getDonationStats
      tags: [donations]
      summary: Donation summary for admin dashboard (admin only)
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Donation stats
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DonationStats"
        "401":
          description: Unauthorized

  /admin/donations/settings:
    get:
      operationId: getAdminDonationSettings
      tags: [donations]
      summary: Get donation settings (admin only)
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Donation settings
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DonationSettings"
        "401":
          description: Unauthorized
    put:
      operationId: updateDonationSettings
      tags: [donations]
      summary: Update donation settings (admin only)
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DonationSettingsInput"
      responses:
        "200":
          description: Settings updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DonationSettings"
        "401":
          description: Unauthorized

  /admin/donations/verify/status:
    get:
      operationId: getDonationVerificationStatus
      tags: [donations]
      summary: Status auto-verifikasi donasi QRIS (terhubung? auto aktif?)
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Verification status
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DonationVerificationStatus"
        "401":
          description: Unauthorized

  /admin/donations/verify/otp:
    post:
      operationId: requestDonationVerificationOtp
      tags: [donations]
      summary: Minta kode OTP GoPay Merchant ke nomor HP merchant
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DonationVerificationOtpRequest"
      responses:
        "200":
          description: OTP terkirim
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DonationVerificationOtpResponse"
        "400":
          description: Permintaan ditolak
        "401":
          description: Unauthorized

  /admin/donations/verify/login:
    post:
      operationId: loginDonationVerification
      tags: [donations]
      summary: Tukar kode OTP dengan sesi GoPay Merchant (disimpan terenkripsi)
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DonationVerificationLoginRequest"
      responses:
        "200":
          description: Berhasil terhubung
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DonationVerificationLoginResponse"
        "400":
          description: OTP salah / kadaluarsa
        "401":
          description: Unauthorized

  /admin/donations/verify/logout:
    post:
      operationId: logoutDonationVerification
      tags: [donations]
      summary: Putuskan sesi GoPay Merchant
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Sesi diputus
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok:
                    type: boolean
                  message:
                    type: string
        "401":
          description: Unauthorized

  /admin/donations/verify/run:
    post:
      operationId: runDonationVerification
      tags: [donations]
      summary: "Opsi 1 - verifikasi manual: tarik mutasi QRIS & cocokkan sekarang"
      security:
        - bearerAuth: []
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                windowMinutes:
                  type: integer
                  description: Seberapa jauh ke belakang feed mutasi dipindai (menit)
      responses:
        "200":
          description: Hasil verifikasi
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DonationVerificationRunResult"
        "401":
          description: Unauthorized
        "500":
          description: Gagal menjalankan verifikasi

  /admin/donations/verify/runs:
    get:
      operationId: listDonationVerificationRuns
      tags: [donations]
      summary: Riwayat pemeriksaan mutasi (manual & otomatis)
      security:
        - bearerAuth: []
      parameters:
        - name: limit
          in: query
          schema:
            type: integer
            default: 20
      responses:
        "200":
          description: Riwayat pemeriksaan
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/DonationVerificationRun"
        "401":
          description: Unauthorized

  /admin/donations/verify/settings:
    put:
      operationId: updateDonationVerificationSettings
      tags: [donations]
      summary: Setelan auto-verifikasi (nyala/mati + rentang feed)
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DonationVerificationSettingsInput"
      responses:
        "200":
          description: Setelan tersimpan
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DonationVerificationSettings"
        "401":
          description: Unauthorized

  /internal/donations/verify/run:
    post:
      operationId: runInternalDonationVerification
      tags: [donations]
      summary: Opsi 2 - endpoint internal untuk pemicu otomatis (cron/worker)
      description: >
        Dipanggil oleh pemicu eksternal (GitHub Actions cron atau worker di
        host gratis). Memerlukan header `x-cron-secret` yang sama dengan env
        `CRON_SECRET` di server. Kalau auto-verifikasi dimatikan, endpoint
        ini hanya melaporkan "skipped".
      parameters:
        - name: x-cron-secret
          in: header
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Hasil verifikasi
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DonationVerificationRunResult"
        "401":
          description: Unauthorized
        "404":
          description: Verifikasi otomatis tidak diaktifkan

