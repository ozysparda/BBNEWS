        pendingCount:
          type: integer
          description: Jumlah transaksi donasi yang masih menunggu verifikasi.
      required:
        - connected
        - autoVerifyEnabled
        - pendingCount

    DonationVerificationOtpRequest:
      type: object
      properties:
        phoneNumber:
          type: string
          description: Nomor HP akun GoPay Merchant (format 62xxx / 0xxx).
      required:
        - phoneNumber

    DonationVerificationOtpResponse:
      type: object
      properties:
        ok:
          type: boolean
        message:
          type: string
        otpLength:
          type: integer
        expiresAt:
          type: string

    DonationVerificationLoginRequest:
      type: object
      properties:
        otp:
          type: string
          description: Kode OTP yang dikirim ke HP merchant.
      required:
        - otp

    DonationVerificationLoginResponse:
      type: object
      properties:
        ok:
          type: boolean
        message:
          type: string
        merchantId:
          type: ["string", "null"]
        merchantName:
          type: ["string", "null"]

    DonationVerificationMatch:
      type: object
      description: Satu transaksi donasi yang berhasil dicocokkan dengan mutasi.
      properties:
        transactionId:
          type: integer
        referenceNumber:
          type: string
        amount:
          type: integer
          description: Nominal bersih donasi.
        grossAmount:
          type: integer
          description: Nominal yang dibayar donatur (amount + fee MDR).
        orderId:
          type: ["string", "null"]
          description: Order id QRIS di sisi GoPay (bukti untuk admin).
        paidAt:
          type: string

    DonationVerificationAmbiguous:
      type: object
      description: Transaksi yang tidak bisa dicocokkan secara pasti -> perlu dicek admin.
      properties:
        transactionId:
          type: integer
        referenceNumber:
          type: string
        grossAmount:
          type: integer
        candidateCount:
          type: integer

    DonationVerificationRunResult:
      type: object
      properties:
        status:
          type: string
          enum: ["ok", "skipped", "error"]
        message:
          type: string
        feedCount:
          type: integer
          description: Jumlah baris mutasi QRIS yang terbaca.
        matchedCount:
          type: integer
          description: Jumlah transaksi donasi yang terverifikasi otomatis.
        pendingBefore:
          type: integer
        pendingAfter:
          type: integer
        matches:
          type: array
          items:
            $ref: "#/components/schemas/DonationVerificationMatch"
        ambiguous:
          type: array
          items:
            $ref: "#/components/schemas/DonationVerificationAmbiguous"
      required:
        - status
        - matchedCount

    DonationVerificationRun:
      type: object
      description: Riwayat satu kali pemeriksaan mutasi.
      properties:
        id:
          type: integer
        source:
          type: string
          enum: ["manual", "auto"]
        status:
          type: string
          enum: ["ok", "skipped", "error"]
        message:
          type: ["string", "null"]
        feedCount:
          type: integer
        matchedCount:
          type: integer
        pendingBefore:
          type: integer
        pendingAfter:
          type: integer
        details:
          type: ["object", "null"]
        startedAt:
          type: ["string", "null"]
        finishedAt:
          type: ["string", "null"]
        createdAt:
          type: ["string", "null"]
      required:
        - id
        - source
        - status

    DonationVerificationSettingsInput:
      type: object
      properties:
        autoVerifyEnabled:
          type: boolean
        autoVerifyWindowMinutes:
          type: integer
          description: Seberapa jauh ke belakang feed mutasi dipindai (menit).

    DonationVerificationSettings:
      type: object
      properties:
        autoVerifyEnabled:
          type: boolean
        autoVerifyWindowMinutes:
          type: integer
      required:
        - autoVerifyEnabled
        - autoVerifyWindowMinutes
