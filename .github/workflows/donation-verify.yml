# Auto-verifikasi donasi QRIS (Opsi 2 - pemicu otomatis, gratis)
#
# Repo GitHub Actions cron memanggil endpoint internal BBNEWS setiap 5 menit.
# Endpoint yang dipanggil sudah melakukan pencocokan mutasi QRIS -> transaksi
# donasi "pending" berubah jadi "terverifikasi".
#
# Yang dibutuhkan:
#   - Secret repo: CRON_SECRET  (nilainya HARUS sama dengan env CRON_SECRET
#     di Vercel project bbnews)
#   - Auto-verifikasi harus dinyalakan di panel admin:
#     /admin/donasi/verifikasi -> toggle "Auto-verifikasi"
#
# Catatan kuota: private repo Free GitHub memberi 2.000 menit/bulan.
# Cron tiap 5 menit ≈ 288 eksekusi/hari; tiap eksekusi hanya beberapa detik.
# Kalau kuota habis, ubah schedule jadi "*/15 * * * *".
#
# Kredensial GoPay Merchant TIDAK ada di sini - sesi tersimpan terenkripsi di
# database aplikasi. Repo ini hanya memanggil satu endpoint.

name: Auto-verifikasi Donasi QRIS

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

concurrency:
  group: donation-verify
  cancel-in-progress: true

jobs:
  verify:
    name: Cek mutasi QRIS
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Panggil endpoint verifikasi donasi
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
          VERIFY_URL: https://berugaknews.com/api/internal/donations/verify/run
        run: |
          if [ -z "$CRON_SECRET" ]; then
            echo "::error::Secret CRON_SECRET belum diset di repository ini."
            exit 1
          fi
          response=$(curl -sS -w '\n%{http_code}' -X POST "$VERIFY_URL" \
            -H "x-cron-secret: $CRON_SECRET" \
            -H "accept: application/json" \
            --max-time 60)
          code=$(printf '%s' "$response" | tail -n1)
          body=$(printf '%s' "$response" | sed '$d')
          echo "HTTP $code"
          echo "$body"
          if [ "$code" -ge 400 ]; then
            echo "::error::Endpoint verifikasi donasi gagal (HTTP $code)."
            exit 1
          fi
